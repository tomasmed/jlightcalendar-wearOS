name: Continuous Integration (Wear OS Gradle Gate)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Kotlin, Unit Tests, Lint & Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle Caching
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests & Android Lint Gate
        run: ./gradlew check lintDebug --stacktrace

      - name: Assemble Debug Wear OS APK
        run: ./gradlew assembleDebug --stacktrace
